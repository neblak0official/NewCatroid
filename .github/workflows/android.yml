name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace -x lint -x test

      - name: Find and Rename APK
        run: |
          mkdir -p final-apk
          find . -name "*.apk" -exec cp {} final-apk/neblak-necatroid-release.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neblak-necatroid-release
          path: final-apk/neblak-necatroid-release.apk
